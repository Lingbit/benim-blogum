<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lingbit Yönetim</title>
<style>
body{font-family:sans-serif;background:#FDF8F5;color:#4A4A4A;padding:20px}
.box{max-width:650px;margin:auto;background:#FFF;padding:25px;border-radius:16px;border:1px solid #F4C2C2}
input,select,textarea{width:100%;padding:10px;margin:8px 0 15px;border:1px solid #E5D4D4;border-radius:8px;box-sizing:border-box}
button{background:#F4C2C2;color:#FFF;border:none;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;margin-top:5px}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{background:#FDF8F5;color:#4A4A4A;border:1px solid #F4C2C2}
.tab.aktif{background:#F4C2C2;color:#FFF}
.satir{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #EEE}
.kucuk{width:auto;padding:5px 10px;font-size:12px;margin:0 2px}
</style>
</head>
<body>

<div class="box" id="giris" style="max-width:360px">
  <h2>🔒 Panel Girişi</h2>
  <input type="password" id="sifre" placeholder="Şifren (1234)">
  <button onclick="ac()">Giriş Yap</button>
</div>

<div class="box" id="panel" style="display:none">
  <h2>🌸 Lingbit Yönetim</h2>
  <input type="password" id="token" placeholder="GitHub Token (ghp_...)">
  
  <div class="tabs">
    <button class="tab aktif" id="b1" onclick="sekme('s1',this)">✍️ Yazı Ekle/Düzenle</button>
    <button class="tab" id="b2" onclick="sekme('s2',this)">🏠 Ana Sayfa</button>
    <button class="tab" id="b3" onclick="sekme('s3',this)">📚 Yazılarım</button>
  </div>

  <div id="s1" class="alan">
    <input type="text" id="baslik" placeholder="Yazı Başlığı">
    <select id="kategori">
      <option value="korece">Korece</option>
      <option value="japonca">Japonca</option>
      <option value="ingilizce">İngilizce</option>
      <option value="lifestyle">Lifestyle</option>
      <option value="motivasyon">Motivasyon</option>
    </select>
    <label>Kapak Fotoğrafı (İsteğe Bağlı):</label>
    <input type="file" id="kapak" accept="image/*">
    <input type="text" id="ozet" placeholder="Kısa Özet">
    <textarea id="icerik" rows="8" placeholder="Yazı içeriği..."></textarea>
    <input type="file" id="icResim" accept="image/*" style="display:none" onchange="resimEkle()">
    <button type="button" style="background:#A8D5BA;margin-bottom:10px" onclick="document.getElementById('icResim').click()">🖼️ Metin İçi Fotoğraf Ekle</button>
    <button onclick="kaydet()" id="kaydetBtn">✨ Yayınla</button>
    <button onclick="sifirla()" id="iptalBtn" style="background:#CCC;display:none">İptal</button>
  </div>

  <div id="s2" class="alan" style="display:none">
    <input type="text" id="aBaslik" placeholder="Site Ana Başlığı">
    <input type="text" id="aAlt" placeholder="Alt Slogan">
    <textarea id="aHakkimda" rows="4" placeholder="Hakkımda Yazısı"></textarea>
    <button onclick="ayarKaydet()">💾 Ana Sayfayı Güncelle</button>
  </div>

  <div id="s3" class="alan" style="display:none">
    <div id="liste">Yükleniyor...</div>
  </div>

  <p id="mesaj" style="text-align:center;font-weight:bold"></p>
</div>

<script>
const API_URL = "https://github.com";
const RAW_URL = "https://githubusercontent.com";
const SIFRE = "1234";

let duzenleYol = null, duzenleSha = null, eskiKapak = "", yazilar = [];
if(localStorage.getItem("tk")) document.getElementById("token").value = localStorage.getItem("tk");

function ac() {
  if(document.getElementById("sifre").value === SIFRE) {
    document.getElementById("giris").style.display = "none";
    document.getElementById("panel").style.display = "block";
    ayarGetir();
  } else alert("Yanlış şifre!");
}

function sekme(id, btn) {
  document.querySelectorAll(".alan").forEach(e => e.style.display = "none");
  document.querySelectorAll(".tab").forEach(e => e.classList.remove("aktif"));
  document.getElementById(id).style.display = "block";
  btn.classList.add("aktif");
  if(id === "s2") ayarGetir();
  if(id === "s3") listeGetir();
}

function dosyaOku(dosya) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',').pop());
    reader.onerror = reject;
    reader.readAsDataURL(dosya);
  });
}

async function apiPut(yol, icerikB64, msj, sha=null) {
  const tk = document.getElementById("token").value.trim();
  if(!tk) throw new Error("GitHub Token kutusu boş!");
  localStorage.setItem("tk", tk);
  const body = { message: msj, content: icerikB64 };
  if(sha) body.sha = sha;
  const hedefUrl = "https://github.com" + yol;
  const res = await fetch(hedefUrl, {
    method: "PUT",
    headers: { "Authorization": "token " + tk, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const veri = await res.json();
  if(!res.ok) throw new Error("GitHub Yanıtı (" + res.status + "): " + veri.message + " | Adres: " + hedefUrl);
}
  }

async function ayarGetir() {
  try {
    const r = await fetch(RAW_URL + "ayarlar.json?t=" + Date.now());
    const d = await r.json();
    document.getElementById("aBaslik").value = d.siteBaslik || "";
    document.getElementById("aAlt").value = d.altBaslik || "";
    document.getElementById("aHakkimda").value = d.hakkimda || "";
  } catch(e) {}
}

async function ayarKaydet() {
  const m = document.getElementById("mesaj"); m.innerText = "⏳ Kaydediliyor...";
  try {
    const g = await (await fetch(API_URL + "ayarlar.json?t=" + Date.now())).json();
    const veri = { siteBaslik: document.getElementById("aBaslik").value, altBaslik: document.getElementById("aAlt").value, hakkimda: document.getElementById("aHakkimda").value };
    await apiPut("ayarlar.json", btoa(unescape(encodeURIComponent(JSON.stringify(veri,null,2)))), "Ayarlar", g.sha);
    m.innerText = "✅ Ana sayfa güncellendi!";
  } catch(e) { m.innerText = "❌ " + e.message; }
}

async function listeGetir() {
  const l = document.getElementById("liste"); l.innerHTML = "Yükleniyor...";
  const dosyalar = await (await fetch(API_URL + "_posts?t=" + Date.now())).json();
  l.innerHTML = ""; yazilar = [];
  for(const d of dosyalar) {
    if(d.name.endsWith(".json")) {
      const y = await (await fetch(d.download_url + "?t=" + Date.now())).json();
      const i = yazilar.push({...y, path: d.path, sha: d.sha}) - 1;
      l.innerHTML += '<div class="satir"><span>' + y.baslik + '</span><div><button class="kucuk" style="background:#89CFF0" onclick="duzenle(' + i + ')">Düzenle</button><button class="kucuk" style="background:#F08080" onclick="sil(\'' + d.path + '\',\'' + d.sha + '\')">Sil</button></div></div>';
    }
  }
}

function duzenle(i) {
  const y = yazilar[i]; duzenleYol = y.path; duzenleSha = y.sha; eskiKapak = y.resim || "";
  document.getElementById("baslik").value = y.baslik; document.getElementById("kategori").value = y.kategori;
  document.getElementById("ozet").value = y.ozet; document.getElementById("icerik").value = y.icerik;
  document.getElementById("kaydetBtn").innerText = "💾 Değişiklikleri Kaydet";
  document.getElementById("iptalBtn").style.display = "block";
  sekme("s1", document.getElementById("b1"));
}

function sifirla() {
  duzenleYol = null; duzenleSha = null; eskiKapak = "";
  ["baslik","ozet","icerik"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("kaydetBtn").innerText = "✨ Yayınla";
  document.getElementById("iptalBtn").style.display = "none";
}

async function sil(yol, sha) {
  const tk = document.getElementById("token").value.trim();
  if(!tk || !confirm("Silinsin mi?")) return;
  await fetch(API_URL + yol, {
    method: "DELETE", headers: { "Authorization": "Bearer " + tk, "Content-Type": "application/json" }, body: JSON.stringify({ message: "Sil", sha })
  });
  listeGetir();
}

async function resimEkle() {
  const dosyalar = document.getElementById("icResim").files;
  if(!dosyalar || dosyalar.length === 0) return;
  const f = dosyalar.item(0);
  const m = document.getElementById("mesaj"); m.innerText = "⏳ Fotoğraf yükleniyor...";
  try {
    const ad = "images/" + Date.now() + "-" + f.name.replace(/[^a-zA-Z0-9.]/g,'-');
    const b64Veri = await dosyaOku(f);
    await apiPut(ad, b64Veri, "Resim");
    document.getElementById("icerik").value += "\n\n![Görsel](" + RAW_URL + ad + ")\n\n";
    m.innerText = "✅ Fotoğraf eklendi!";
  } catch(e) { m.innerText = "❌ " + e.message; }
}

async function kaydet() {
  const m = document.getElementById("mesaj"); m.innerText = "⏳ Kaydediliyor...";
  try {
    let kapakUrl = eskiKapak;
    const dosyalar = document.getElementById("kapak").files;
    if(dosyalar && dosyalar.length > 0) {
      const f = dosyalar.item(0);
      const ad = "images/" + Date.now() + "-" + f.name.replace(/[^a-zA-Z0-9.]/g,'-');
      const b64Veri = await dosyaOku(f);
      await apiPut(ad, b64Veri, "Kapak");
      kapakUrl = RAW_URL + ad;
    }
    const veri = { baslik: document.getElementById("baslik").value, kategori: document.getElementById("kategori").value, resim: kapakUrl, ozet: document.getElementById("ozet").value, icerik: document.getElementById("icerik").value };
    const yol = duzenleYol || ("_posts/" + Date.now() + ".json");
    await apiPut(yol, btoa(unescape(encodeURIComponent(JSON.stringify(veri,null,2)))), "Yazı", duzenleSha);
    m.innerText = "🎉 Başarıyla kaydedildi!"; sifirla();
  } catch(e) { m.innerText = "❌ " + e.message; }
}
</script>
</body>
</html>
