<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingbit | Yönetim Paneli</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background: #FDF8F5; color: #4A4A4A; margin: 0; padding: 30px 15px; }
        .panel { max-width: 680px; margin: 0 auto; background: #FFF; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #F4C2C2; }
        h1 { text-align: center; margin-top: 0; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #FDF8F5; padding-bottom: 10px; }
        .tab-btn { flex: 1; background: #FDF8F5; color: #4A4A4A; margin: 0; padding: 10px; border-radius: 12px; border: 1px solid #F4C2C2; cursor: pointer; font-weight: 700; }
        .tab-btn.active { background: #F4C2C2; color: #FFF; }
        label { display: block; font-weight: 700; margin: 14px 0 5px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #E5D4D4; border-radius: 12px; font-family: inherit; box-sizing: border-box; }
        textarea { height: 180px; resize: vertical; }
        button.main-btn { background: #F4C2C2; color: #FFF; border: none; padding: 14px; border-radius: 14px; font-family: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 20px; }
        button.main-btn:hover { background: #E5A9A9; }
        .small-btn { background: #E8F5E9; color: #2E7D32; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .yazi-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #F3EAE8; }
        .sil-btn { background: #FFEBEE; color: #C62828; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        #durum { text-align: center; font-weight: 700; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="panel" id="giris-ekrani" style="max-width: 400px;">
        <h1>🔒 Panel Girişi</h1>
        <label>Panel Şifren:</label>
        <input type="password" id="sifre-input" placeholder="Şifreni gir...">
        <button class="main-btn" onclick="girisYap()">Giriş Yap</button>
    </div>

    <div class="panel" id="yonetim-ekrani" style="display:none;">
        <h1>🌸 Blog Yönetim Merkezi</h1>
        
        <label>GitHub Anahtarı (Token):</label>
        <input type="password" id="token" placeholder="ghp_... anahtarın">

        <div class="tabs" style="margin-top: 20px;">
            <button class="tab-btn active" onclick="sekmeAc('yazi-ekle', this)">✍️ Yeni Yazı</button>
            <button class="tab-btn" onclick="sekmeAc('ana-sayfa', this)">🏠 Ana Sayfa Ayarları</button>
            <button class="tab-btn" onclick="sekmeAc('yazilarim', this)">📚 Yazıları Yönet</button>
        </div>

        <div id="yazi-ekle" class="sekme">
            <label>Yazı Başlığı:</label>
            <input type="text" id="baslik" placeholder="Örn: Korece Günlük Kalıplar">
            <label>Kategori:</label>
            <select id="kategori">
                <option value="korece">🇰🇷 Korece</option>
                <option value="japonca">🇯🇵 Japonca</option>
                <option value="ingilizce">🇬🇧 İngilizce</option>
                <option value="lifestyle">🌸 Lifestyle</option>
                <option value="motivasyon">✨ Motivasyon</option>
            </select>
            <label>Kapak Görseli:</label>
            <input type="file" id="kapakDosya" accept="image/*">
            <label>Kısa Özet:</label>
            <input type="text" id="ozet" placeholder="Ana sayfada görünecek özet...">
            <label>Yazı İçeriği:</label>
            <textarea id="icerik" placeholder="Yazını buraya yaz..."></textarea>
            <input type="file" id="icerikResimDosya" accept="image/*" style="display:none" onchange="icerigeResimYukle()">
            <button type="button" class="small-btn" onclick="document.getElementById('icerikResimDosya').click()">🖼️ Metnin İçine Fotoğraf Ekle</button>
            <button class="main-btn" onclick="yayinla()">✨ Yazıyı Yayınla</button>
        </div>

        <div id="ana-sayfa" class="sekme" style="display:none;">
            <label>Blog Ana Başlığı:</label>
            <input type="text" id="siteBaslik">
            <label>Alt Slogan / Açıklama:</label>
            <input type="text" id="altBaslik">
            <label>Hakkımda Kutusu Metni:</label>
            <textarea id="hakkimda" style="height:100px;"></textarea>
            <button class="main-btn" onclick="ayarlariKaydet()">💾 Ana Sayfa Değişikliklerini Kaydet</button>
        </div>

        <div id="yazilarim" class="sekme" style="display:none;">
            <div id="yazi-listesi">Yükleniyor...</div>
        </div>

        <p id="durum"></p>
    </div>

    <script>
        const KULLANICI = "Lingbit";
        const DEPO = "benim-blogum";
        const PANEL_SIFRESI = "Tkarul2026++";

        if(localStorage.getItem("blog_token")) document.getElementById("token").value = localStorage.getItem("blog_token");

        function girisYap() {
            if(document.getElementById("sifre-input").value === PANEL_SIFRESI) {
                document.getElementById("giris-ekrani").style.display = "none";
                document.getElementById("yonetim-ekrani").style.display = "block";
                mevcutAyarlariGetir();
            } else {
                alert("Hatalı şifre!");
            }
        }

        function sekmeAc(id, btn) {
            document.querySelectorAll(".sekme").forEach(s => s.style.display = "none");
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(id).style.display = "block";
            btn.classList.add("active");
            if(id === "yazilarim") yazilariListele();
        }

        function dosyaBase64(file) {
            return new Promise(res => {
                const r = new FileReader();
                r.onload = () => res(r.result.split(',')[1]);
                r.readAsDataURL(file);
            });
        }

        async function githubIslem(yol, icerikB64, mesaj, token, sha = null) {
            const body = { message: mesaj, content: icerikB64 };
            if(sha) body.sha = sha;
            const res = await fetch(`https://github.com{KULLANICI}/${DEPO}/contents/${yol}`, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error("İşlem başarısız! Token veya kullanıcı adını kontrol et.");
        }

        async function mevcutAyarlariGetir() {
            try {
                const res = await fetch(`https://github.com{KULLANICI}/${DEPO}/contents/ayarlar.json`);
                const data = await res.json();
                const ayar = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                document.getElementById("siteBaslik").value = ayar.siteBaslik || "";
                document.getElementById("altBaslik").value = ayar.altBaslik || "";
                document.getElementById("hakkimda").value = ayar.hakkimda || "";
            } catch(e) {}
        }

        async function ayarlariKaydet() {
            const token = document.getElementById("token").value.trim();
            if(!token) return alert("Token girmelisin!");
            localStorage.setItem("blog_token", token);
            document.getElementById("durum").innerText = "⏳ Ana sayfa güncelleniyor...";
            try {
                const getRes = await fetch(`https://github.com{KULLANICI}/${DEPO}/contents/ayarlar.json`);
                const getData = await getRes.json();
                const yeniAyar = {
                    siteBaslik: document.getElementById("siteBaslik").value,
                    altBaslik: document.getElementById("altBaslik").value,
                    hakkimda: document.getElementById("hakkimda").value
                };
                const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(yeniAyar, null, 2))));
                await githubIslem("ayarlar.json", b64, "Ana sayfa ayarları güncellendi", token, getData.sha);
                document.getElementById("durum").innerText = "✅ Ana sayfa başarıyla güncellendi!";
            } catch(e) { document.getElementById("durum").innerText = "❌ Hata: " + e.message; }
        }

        async function yazilariListele() {
            const liste = document.getElementById("yazi-listesi");
            liste.innerHTML = "Yükleniyor...";
            const res = await fetch(`https://github.com{KULLANICI}/${DEPO}/contents/_posts`);
            const dosyalar = await res.json();
            liste.innerHTML = "";
            for(const d of dosyalar) {
                if(d.name.endsWith(".json")) {
                    const r = await fetch(d.download_url);
                    const y = await r.json();
                    liste.innerHTML += `<div class="yazi-item"><span><b>${y.baslik}</b> (${y.kategori})</span><button class="sil-btn" onclick="yaziSil('${d.path}', '${d.sha}')">Sil</button></div>`;
                }
            }
        }

        async function yaziSil(yol, sha) {
            const token = document.getElementById("token").value.trim();
            if(!token || !confirm("Bu yazıyı silmek istediğine emin misin?")) return;
            await fetch(`https://github.com{KULLANICI}/${DEPO}/contents/${yol}`, {
                method: "DELETE",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Yazı silindi", sha: sha })
            });
            yazilariListele();
        }

        async function icerigeResimYukle() {
            const file = document.getElementById("icerikResimDosya").files[0];
            const token = document.getElementById("token").value.trim();
            if (!file || !token) return alert("Önce Token girmelisin!");
            document.getElementById("durum").innerText = "⏳ Fotoğraf yükleniyor...";
            try {
                const dosyaAdi = `images/${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
                const b64 = await dosyaBase64(file);
                await githubIslem(dosyaAdi, b64, "Görsel eklendi", token);
                document.getElementById("icerik").value += `\n\n![Görsel](https://githubusercontent.com{KULLANICI}/${DEPO}/main/${dosyaAdi})\n\n`;
                document.getElementById("durum").innerText = "✅ Fotoğraf metne eklendi!";
            } catch (e) { document.getElementById("durum").innerText = "❌ Hata: " + e.message; }
        }

        async function yayinla() {
            const token = document.getElementById("token").value.trim();
            const baslik = document.getElementById("baslik").value.trim();
            const kategori = document.getElementById("kategori").value;
            const ozet = document.getElementById("ozet").value.trim();
            const icerik = document.getElementById("icerik").value;
            const kapakFile = document.getElementById("kapakDosya").files[0];
            if (!token || !baslik || !icerik) return alert("Anahtar, başlık ve içerik zorunludur!");
            localStorage.setItem("blog_token", token);
            document.getElementById("durum").innerText = "⏳ Yayınlanıyor...";
            try {
                let kapakUrl = "";
                if (kapakFile) {
                    const kapakAdi = `images/${Date.now()}-${kapakFile.name.replace(/\s+/g, '-')}`;
                    await githubIslem(kapakAdi, await dosyaBase64(kapakFile), "Kapak görseli", token);
                    kapakUrl = `https://githubusercontent.com{KULLANICI}/${DEPO}/main/${kapakAdi}`;
                }
                const jsonB64 = btoa(unescape(encodeURIComponent(JSON.stringify({ baslik, kategori, resim: kapakUrl, ozet, icerik }, null, 2))));
                await githubIslem(`_posts/${Date.now()}.json`, jsonB64, `Yeni yazı: ${baslik}`, token);
                document.getElementById("durum").innerText = "🎉 Yazın yayınlandı!";
            } catch (e) { document.getElementById("durum").innerText = "❌ Hata: " + e.message; }
        }
    </script>
