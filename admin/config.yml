backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "yazilar"
    label: "Blog Yazıları"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Başlık", name: "baslik", widget: "string"}
      - {label: "Kategori", name: "kategori", widget: "select", options: ["korece", "japonca", "ingilizce", "lifestyle", "motivasyon"]}
      - {label: "Kapak Görseli", name: "resim", widget: "image"}
      - {label: "Kısa Özet", name: "ozet", widget: "text"}
      - {label: "Yazı İçeriği", name: "icerik", widget: "markdown"}
